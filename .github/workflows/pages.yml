name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: List the buildings
        id: list
        run: |
          node -e "import('./tools/build.mjs').then(m=>console.log(m.listBuildings().map(b=>b.id).join(' ')))" > /tmp/ids
          echo "ids=$(cat /tmp/ids)" >> "$GITHUB_OUTPUT"
          cat /tmp/ids

      - name: Check every building's model
        run: |
          for id in ${{ steps.list.outputs.ids }}; do node tools/check.mjs "$id"; done

      # The framing plan reads the model but splices and sizes on its own, so
      # it can drift away from the building without the model checks noticing.
      - name: Check the framing plan against every saved layout
        run: node tools/framing-check.mjs

      - name: Build the pages
        run: node tools/build.mjs

      - name: Collect the shared layouts
        run: node tools/build-layout-index.mjs

      - name: Write the landing page
        run: node tools/build-landing.mjs

      # The stage rail has slipped out of reach twice in ways the node checks
      # cannot see, so the layout gets asserted in a real browser.
      - name: Check the page layout in a browser
        run: |
          npm install --no-save playwright@1.61.1
          npx playwright install --with-deps chromium
          for id in ${{ steps.list.outputs.ids }}; do node tools/viewport-check.mjs "$id"; done

      # The panel files never run under tools/check.mjs — it has no DOM — so
      # picking and dragging an opening had no test at all until one broke.
      - name: Check picking and dragging in a browser
        run: |
          for id in ${{ steps.list.outputs.ids }}; do node tools/interact-check.mjs "$id"; done

      - name: Assemble the site
        run: |
          mkdir -p _site/layouts
          cp index.html _site/index.html
          cp -r layouts/. _site/layouts/
          for id in ${{ steps.list.outputs.ids }}; do
            mkdir -p "_site/$id"
            cp "buildings/$id/dist/index.html" "_site/$id/index.html"
          done
          touch _site/.nojekyll
          find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
