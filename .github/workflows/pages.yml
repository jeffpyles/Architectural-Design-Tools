name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it mid-deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the shop building model
        working-directory: shop-building
        run: node tools/check.mjs

      - name: Build the shop building page
        working-directory: shop-building
        run: node build.mjs

      - name: Collect the shared layouts
        run: node tools/build-layout-index.mjs

      # The stage rail has slipped out of reach twice in ways the node checks
      # cannot see, so the layout gets asserted in a real browser.
      - name: Check the page layout in a browser
        working-directory: shop-building
        run: |
          npm install --no-save playwright@1.61.1
          npx playwright install --with-deps chromium
          node tools/viewport-check.mjs

      - name: Assemble the site
        run: |
          mkdir -p _site/shop-building _site/layouts
          cp index.html _site/index.html
          cp shop-building/dist/index.html _site/shop-building/index.html
          cp layouts/*.json _site/layouts/
          touch _site/.nojekyll
          ls -R _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
